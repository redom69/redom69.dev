name: Notify Newsletter — New Post

on:
  push:
    branches:
      - master
    paths:
      - 'src/content/posts/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new posts
        id: detect
        run: |
          # Posts en el commit anterior
          PREV=$(git ls-tree -r --name-only HEAD~1 -- src/content/posts/ | grep '\.md$' | sort)
          # Posts en el commit actual
          CURR=$(git ls-tree -r --name-only HEAD -- src/content/posts/ | grep '\.md$' | sort)

          # Archivos que están en CURR pero no en PREV = posts nuevos
          NEW_FILES=$(comm -13 <(echo "$PREV") <(echo "$CURR"))

          echo "Posts nuevos: $NEW_FILES"

          FILE1=$(echo "$NEW_FILES" | head -1)
          SLUG1=$(basename "$FILE1" .md)
          TITLE1=""; IMAGE1=""; DESC1=""
          if [ -f "$FILE1" ]; then
            TITLE1=$(grep -m1 '^title:' "$FILE1" | sed 's/^title: *//;s/^["'"'"']//;s/["'"'"']$//')
            IMAGE1=$(grep -m1 '^image:' "$FILE1" | sed 's/^image: *//;s/^["'"'"']//;s/["'"'"']$//')
            DESC1=$(grep -m1 '^description:' "$FILE1" | sed 's/^description: *//;s/^["'"'"']//;s/["'"'"']$//')
          fi

          # Slug2 = segundo post más reciente del repo (por fecha en frontmatter)
          ALL_POSTS=$(git ls-tree -r --name-only HEAD -- src/content/posts/ | grep '\.md$')
          SECOND_FILE=$(echo "$ALL_POSTS" | while read f; do
            DATE=$(grep -m1 '^date:' "$f" 2>/dev/null | sed 's/^date: *//')
            echo "$DATE $f"
          done | sort -r | grep -v "$(basename "$FILE1")" | head -1 | awk '{print $2}')

          SLUG2=$(basename "$SECOND_FILE" .md)
          TITLE2=""; IMAGE2=""; DESC2=""
          if [ -f "$SECOND_FILE" ]; then
            TITLE2=$(grep -m1 '^title:' "$SECOND_FILE" | sed 's/^title: *//;s/^["'"'"']//;s/["'"'"']$//')
            IMAGE2=$(grep -m1 '^image:' "$SECOND_FILE" | sed 's/^image: *//;s/^["'"'"']//;s/["'"'"']$//')
            DESC2=$(grep -m1 '^description:' "$SECOND_FILE" | sed 's/^description: *//;s/^["'"'"']//;s/["'"'"']$//')
          fi

          echo "slug1=$SLUG1" >> $GITHUB_OUTPUT
          echo "slug2=$SLUG2" >> $GITHUB_OUTPUT
          echo "title1=$TITLE1" >> $GITHUB_OUTPUT
          echo "title2=$TITLE2" >> $GITHUB_OUTPUT
          echo "image1=$IMAGE1" >> $GITHUB_OUTPUT
          echo "image2=$IMAGE2" >> $GITHUB_OUTPUT
          echo "desc1=$DESC1" >> $GITHUB_OUTPUT
          echo "desc2=$DESC2" >> $GITHUB_OUTPUT
          echo "Title 1: $TITLE1 | Slug 1: $SLUG1 | Image: $IMAGE1"
          echo "Title 2: $TITLE2 | Slug 2: $SLUG2 | Image: $IMAGE2"

      - name: Notify subscribers
        if: steps.detect.outputs.slug1 != ''
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          SLUG1="${{ steps.detect.outputs.slug1 }}"
          SLUG2="${{ steps.detect.outputs.slug2 }}"
          TITLE1="${{ steps.detect.outputs.title1 }}"
          TITLE2="${{ steps.detect.outputs.title2 }}"

          IMAGE1="${{ steps.detect.outputs.image1 }}"
          IMAGE2="${{ steps.detect.outputs.image2 }}"
          DESC1="${{ steps.detect.outputs.desc1 }}"
          DESC2="${{ steps.detect.outputs.desc2 }}"

          curl -s -L -X POST https://redom69.dev/api/notify-new-post \
            -H "Content-Type: application/json" \
            -H "X-Notify-Secret: $NOTIFY_SECRET" \
            -d "{
              \"post1_title\": \"$TITLE1\",
              \"post1_link\": \"https://redom69.dev/newsletter/$SLUG1\",
              \"post1_image\": \"$IMAGE1\",
              \"post1_description\": \"$DESC1\",
              \"post2_title\": \"$TITLE2\",
              \"post2_link\": \"https://redom69.dev/newsletter/$SLUG2\",
              \"post2_image\": \"$IMAGE2\",
              \"post2_description\": \"$DESC2\"
            }" | tee response.json

          STATUS=$(cat response.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
          if [ "$STATUS" != "success" ]; then
            echo "Error al notificar: $(cat response.json)"
            exit 1
          fi
          echo "✅ Suscriptores notificados correctamente"
